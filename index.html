<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Partitions</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Partitions">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Accueil : choix du recueil + pavé numérique -->
<section id="home" class="screen active">
  <header class="bar">
    <h1>Partitions</h1>
    <div class="bar-right">
      <button id="btn-grid" class="ghost">▦ Tableau</button>
      <button id="btn-settings" class="ghost" aria-label="Réglages">⚙︎ Recueils</button>
    </div>
  </header>
  <div class="home-body">
    <div class="left">
      <div id="books" class="books"></div>
      <input id="search" class="search" type="search" placeholder="Chercher un titre…" autocomplete="off" autocorrect="off" spellcheck="false">
      <div id="results" class="results"></div>
    </div>
    <div class="entry">
      <div id="display" class="display"><span id="num">&nbsp;</span></div>
      <div id="hint" class="hint">&nbsp;</div>
      <div class="keypad">
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <button data-k="C" class="alt">C</button><button data-k="0">0</button><button data-k="B" class="alt">⌫</button>
      </div>
      <button id="btn-open" class="primary">Ouvrir</button>
    </div>
  </div>
</section>

<!-- Affichage de la partition -->
<section id="viewer" class="screen">
  <header class="bar">
    <button id="btn-back" class="ghost">‹ Retour</button>
    <h2 id="v-title"></h2>
    <div id="v-marks" class="marks" aria-label="Connaissance du chant">
      <button data-m="ok" class="m ok" title="Bien connu" aria-label="Bien connu"></button>
      <button data-m="hard" class="m hard" title="Difficultés" aria-label="Difficultés"></button>
      <button data-m="fail" class="m fail" title="Pas encore" aria-label="Pas encore"></button>
    </div>
    <button class="sung-btn" aria-pressed="false"><span class="box"></span>Chanté<span class="sung-n"></span></button>
    <div class="bar-right">
      <button id="btn-ink" class="ghost icon" aria-label="Annoter" title="Annoter"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 16.5l1-3.6 5.6-5.6a1.6 1.6 0 0 1 2.3 2.3L11.3 15.2z"/><path d="M8 16.5l3.3-1.3"/></svg></button>
      <button id="btn-prev" class="ghost" aria-label="Précédent">◀</button>
      <button id="btn-next" class="ghost" aria-label="Suivant">▶</button>
      <button id="btn-fit" class="ghost icon" aria-label="Page entière" title="Page entière"></button>
      <button id="btn-fix" class="ghost">Corriger</button>
    </div>
  </header>
  <div id="v-tools" class="tools hidden">
    <button data-tool="black" class="sw on" style="--c:#111111" aria-label="Noir"></button>
    <button data-tool="red" class="sw" style="--c:#d62828" aria-label="Rouge"></button>
    <button data-tool="blue" class="sw" style="--c:#1d4ed8" aria-label="Bleu"></button>
    <button data-tool="marker" class="sw marker" style="--c:#ffd60a" aria-label="Surligneur"></button>
    <button data-tool="eraser" class="btn">Gomme</button>
    <button id="btn-undo" class="btn">↶ Annuler</button>
    <button id="btn-clear" class="btn danger">Tout effacer</button>
    <span class="tools-hint">Écrivez avec l’Apple Pencil ; le doigt fait toujours défiler.</span>
  </div>
  <div id="v-warn" class="warn hidden"></div>
  <div id="pages" class="pages"></div>
</section>

<!-- Paroles seules -->
<section id="lyrics" class="screen">
  <header class="bar">
    <button id="l-back" class="ghost">‹ Retour</button>
    <h2 id="l-title"></h2>
    <button class="sung-btn" aria-pressed="false"><span class="box"></span>Chanté<span class="sung-n"></span></button>
    <div class="bar-right">
      <button id="l-prev" class="ghost" aria-label="Précédent">◀</button>
      <button id="l-next" class="ghost" aria-label="Suivant">▶</button>
      <button id="l-smaller" class="ghost" aria-label="Texte plus petit">A−</button>
      <button id="l-bigger" class="ghost" aria-label="Texte plus grand">A+</button>
      <button id="l-score" class="ghost">Partition</button>
    </div>
  </header>
  <div id="l-body" class="l-body"></div>
</section>

<!-- Réglages des recueils -->
<section id="grid" class="screen">
  <header class="bar">
    <button id="g-back" class="ghost">‹ Retour</button>
    <h2>Tableau des chants</h2>
    <div class="bar-right">
      <button id="g-csv" class="ghost">Exporter (Excel)</button>
      <button id="g-hist" class="ghost">Historique (Excel)</button>
      <button id="g-save" class="ghost">Sauvegarder</button>
      <button id="g-restore" class="ghost">Restaurer…</button>
      <input id="g-restore-in" type="file" accept="application/json,.json" class="hidden">
    </div>
  </header>
  <div class="g-filters">
    <div id="g-books" class="chips"></div>
    <div id="g-marks" class="chips"></div>
    <div id="g-sung" class="chips"></div>
    <div id="g-sort" class="chips"></div>
    <input id="g-search" class="search" type="search" placeholder="Filtrer : numéro ou titre…" autocomplete="off" autocorrect="off" spellcheck="false">
    <div id="g-count" class="status"></div>
  </div>
  <div class="g-wrap">
    <table class="g-table">
      <thead><tr><th>Recueil</th><th>N°</th><th>Titre</th><th>Page</th><th>Connaissance</th><th>Chanté</th><th>Dernière fois</th><th>Annotations</th></tr></thead>
      <tbody id="g-body"></tbody>
    </table>
  </div>
</section>

<section id="settings" class="screen">
  <header class="bar">
    <button id="btn-settings-back" class="ghost">‹ Retour</button>
    <h2>Recueils</h2>
    <span></span>
  </header>
  <div id="settings-body" class="settings-body"></div>
  <p class="foot">Les PDF et les paroles restent stockés sur cet appareil uniquement. Version <span id="ver"></span></p>
</section>

<div id="busy" class="busy hidden"><div class="busy-box"><div id="busy-text">…</div><div class="progress"><div id="busy-bar"></div></div></div></div>

<script src="vendor/pdf.min.js"></script>
<script src="app.js"></script>
</body>
</html>
